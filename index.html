<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>틱택토</title>
<style>
  :root {
    --paper: #E9EEF2;
    --surface: #FFFFFF;
    --ink: #1D2B3A;
    --muted: #6B7A8A;
    --line: #C9D3DD;
    --x: #E4572E;
    --o: #2E6FBA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  main { text-align: center; }

  h1 { font-size: 2rem; margin: 0 0 16px; }

  .modes {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }

  .mode-btn {
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }

  .mode-btn[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  .status {
    min-height: 1.5em;
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 1.1rem;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 96px);
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .cell {
    width: 96px;
    height: 96px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    font-size: 2.5rem;
    font-weight: 800;
    cursor: pointer;
  }

  .cell:hover:not(:disabled) { background: #F4F7FA; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: #FFF3CC; }
  .cell:disabled { cursor: default; }

  .scores {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .score {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 18px;
    min-width: 90px;
  }

  .score b { display: block; font-size: 1.4rem; }
  .score.x b { color: var(--x); }
  .score.o b { color: var(--o); }

  button.restart {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button.restart:hover { background: #2E4257; }

  button:focus-visible, .cell:focus-visible {
    outline: 3px solid var(--x);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<main>
  <h1>틱택토</h1>

  <div class="modes" role="group" aria-label="게임 모드">
    <button type="button" class="mode-btn" data-mode="two" aria-pressed="true">2인용</button>
    <button type="button" class="mode-btn" data-mode="computer" aria-pressed="false">컴퓨터 대전</button>
  </div>

  <p class="status" id="status"></p>

  <div class="scores">
    <div class="score x"><span id="label-x">X</span><b id="score-x">0</b></div>
    <div class="score"><span>무승부</span><b id="score-draw">0</b></div>
    <div class="score o"><span id="label-o">O</span><b id="score-o">0</b></div>
  </div>

  <div class="board" id="board"></div>

  <button type="button" class="restart" id="restart">다시 시작</button>
</main>

<script>
  const LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6],
  ];

  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const restartBtn = document.getElementById("restart");
  const modeButtons = document.querySelectorAll(".mode-btn");
  const labelX = document.getElementById("label-x");
  const labelO = document.getElementById("label-o");
  const scoreEls = { X: document.getElementById("score-x"), O: document.getElementById("score-o"), draw: document.getElementById("score-draw") };

  // mode: "two" (2인용) 또는 "computer" (사람 X, 컴퓨터 O)
  let mode = "two";
  let cells = Array(9).fill("");
  let current = "X";
  let over = false;
  let computerTimer = null;
  const score = { X: 0, O: 0, draw: 0 };

  // 칸 9개를 만들어 보드에 붙입니다.
  const buttons = cells.map((_, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cell";
    btn.setAttribute("aria-label", `${i + 1}번 칸`);
    btn.addEventListener("click", () => play(i));
    boardEl.appendChild(btn);
    return btn;
  });

  function findWin(board) {
    for (const line of LINES) {
      const [a, b, c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) return line;
    }
    return null;
  }

  // 컴퓨터(O)가 두는 수: 미니맥스로 최적의 칸을 고릅니다. 컴퓨터는 지지 않습니다.
  function minimax(board, player, depth) {
    const win = findWin(board);
    if (win) return { score: board[win[0]] === "O" ? 10 - depth : depth - 10 };
    if (board.every(Boolean)) return { score: 0 };

    const next = player === "O" ? "X" : "O";
    let best = { score: player === "O" ? -Infinity : Infinity, move: -1 };
    board.forEach((v, i) => {
      if (v) return;
      board[i] = player;
      const { score: s } = minimax(board, next, depth + 1);
      board[i] = "";
      if (player === "O" ? s > best.score : s < best.score) best = { score: s, move: i };
    });
    return best;
  }

  function computerMove() {
    computerTimer = null;
    if (over || current !== "O") return;
    const { move } = minimax([...cells], "O", 0);
    play(move, true);
  }

  function play(i, byComputer = false) {
    if (over || cells[i]) return;
    // 컴퓨터 대전에서는 컴퓨터(O) 차례에 사람이 누를 수 없습니다.
    if (mode === "computer" && current === "O" && !byComputer) return;

    cells[i] = current;
    buttons[i].textContent = current;
    buttons[i].classList.add(current.toLowerCase());
    buttons[i].disabled = true;

    const win = findWin(cells);
    if (win) {
      over = true;
      win.forEach(n => buttons[n].classList.add("win"));
      score[current]++;
      scoreEls[current].textContent = score[current];
      statusEl.textContent = `${winnerName(current)} 승리!`;
      endGame();
    } else if (cells.every(Boolean)) {
      over = true;
      score.draw++;
      scoreEls.draw.textContent = score.draw;
      statusEl.textContent = "무승부입니다.";
      endGame();
    } else {
      current = current === "X" ? "O" : "X";
      showTurn();
      if (mode === "computer" && current === "O") {
        computerTimer = setTimeout(computerMove, 400);
      }
    }
  }

  function winnerName(p) {
    if (mode === "computer") return p === "X" ? "나(X)" : "컴퓨터(O)";
    return p;
  }

  function showTurn() {
    if (mode === "computer") {
      statusEl.textContent = current === "X" ? "내 차례 (X)" : "컴퓨터가 두는 중...";
    } else {
      statusEl.textContent = `${current} 차례`;
    }
  }

  function endGame() {
    buttons.forEach(b => b.disabled = true);
  }

  function reset() {
    // 컴퓨터가 두기로 예약된 상태였다면 취소합니다.
    clearTimeout(computerTimer);
    computerTimer = null;
    cells = Array(9).fill("");
    current = "X";
    over = false;
    buttons.forEach(b => {
      b.textContent = "";
      b.disabled = false;
      b.classList.remove("x", "o", "win");
    });
    showTurn();
  }

  function setMode(newMode) {
    mode = newMode;
    modeButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === newMode)));
    labelX.textContent = mode === "computer" ? "나(X)" : "X";
    labelO.textContent = mode === "computer" ? "컴퓨터(O)" : "O";
    // 모드를 바꾸면 점수를 새로 셉니다.
    score.X = 0; score.O = 0; score.draw = 0;
    scoreEls.X.textContent = 0;
    scoreEls.O.textContent = 0;
    scoreEls.draw.textContent = 0;
    reset();
  }

  modeButtons.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  restartBtn.addEventListener("click", reset);
  setMode("two");
</script>
</body>
</html>
